name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Ruby ${{ matrix.ruby }} / redis-rb ${{ matrix.redis }}.x / Redis ${{ matrix.server }}
    runs-on: ubuntu-latest

    # Covers the whole range cogworker.gemspec claims (Ruby >= 3.1,
    # redis >= 4.8, < 6): several real bugs only ever showed up on an older
    # Ruby or on redis-rb 4.x (Time#iso8601 outside core before 3.4,
    # unsubscribe deadlocking on 4.x, sadd/srem deprecation spam on 4.8).
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.1', '3.2', '3.3', '3.4', '4.0']
        redis: ['4', '5']
        server: ['7']
        # One run against a server without LMOVE (< 6.2): fetch: :reliable
        # must fall back to :basic there (`:old_redis` specs), and the
        # `:reliable_fetch` ones skip themselves.
        include:
          - ruby: '3.4'
            redis: '5'
            server: '6.0'

    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/redis_${{ matrix.redis }}.gemfile

    services:
      redis:
        image: redis:${{ matrix.server }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run rspec
        run: bundle exec rspec
